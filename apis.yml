aid: endotronix
name: Endotronix
description: 'Endotronix, Inc. is a Naperville, Illinois medical device and digital
  health company founded in 2007 and acquired by Edwards Lifesciences in July 2024,
  where it now operates as a wholly owned subsidiary. Endotronix builds the Cordella
  Heart Failure System, an integrated remote heart-failure management platform combining
  an implantable wireless pulmonary artery (PA) pressure sensor — granted FDA premarket
  approval in June 2024 — with a patient-facing myCordella tablet application, connected
  home vitals peripherals (blood pressure cuff, weight scale, pulse oximeter), and the
  myCordella Patient Management Portal, a cloud-based web application clinicians use to
  review transmitted PA pressure, vitals and symptom data and to titrate guideline-directed
  medical therapy. The company publishes clinical evidence (PROACTIVE-HF), instructions
  for use and device manuals, but operates no public developer program: there is no
  developer portal, API reference, SDK, webhook catalog or machine-readable specification
  on any Endotronix host.'
